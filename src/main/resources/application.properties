spring.application.name=RCES
server.port=2520
spring.main.banner-mode=off

#(MySQL)
spring.datasource.url=jdbc:mysql://localhost/rces
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#(PostgreSQL SPM)
app.datasource.spm.url=jdbc:postgresql://192.168.0.14:5432/prod_bms_scmo
app.datasource.spm.username=${SPM_DATASOURCE_USERNAME:postgres}
app.datasource.spm.password=${SPM_DATASOURCE_PASSWORD:change_me}
app.datasource.spm.driver-class-name=org.postgresql.Driver
app.datasource.spm.configuration.maximum-pool-size=10
app.datasource.spm.configuration.connection-timeout=30000
app.datasource.spm.configuration.idle-timeout=600000
app.datasource.spm.configuration.max-lifetime=1800000
app.datasource.spm.configuration.minimum-idle=2

#Spring
spring.jpa.hibernate.ddl-auto=validate
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.task.scheduling.pool.size=5
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
spring.freemarker.expose-request-attributes=true
spring.profiles.active=dev
hibernate.batch_fetch_style=dynamic
hibernate.default_batch_fetch_size=20
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

#Аудит и миграции
spring.jpa.properties.hibernate.default_catalog=rces
spring.jpa.properties.org.hibernate.envers.default_catalog=rces_history
spring.jpa.properties.org.hibernate.envers.default_schema=
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_history
spring.jpa.properties.org.hibernate.envers.audit_table_prefix=
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=rces,rces_history
spring.flyway.repair=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

#SPM-token
authorization.base.client.url=http://localhost:8080/oauth/token
authorization.base.client.credentials=${AUTH_BASE_CLIENT_CREDENTIALS:}
authorization.base.username=${AUTH_BASE_USERNAME:api}
authorization.base.password=${AUTH_BASE_PASSWORD:change_me}

